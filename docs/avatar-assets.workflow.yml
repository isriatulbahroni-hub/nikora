name: Siapkan aset avatar

# Menyematkan (vendoring) TalkingHead dan HeadAudio pada versi terkunci, mengambil avatar dasar CC0 (mpfb.glb)
# bila belum ada, lalu mengompres setiap GLB di game/avatars-src/ ke game/public/avatars/.
# Hasilnya di-commit ke branch yang sama. Berjalan otomatis saat berkas ini dibuat di branch fitur/avatar-talkinghead
# (tidak perlu tombol Run workflow), atau saat ada GLB baru di game/avatars-src/.
# Salin berkas ini ke .github/workflows/avatar-assets.yml agar aktif.
on:
  workflow_dispatch:
  push:
    branches:
      - fitur/avatar-talkinghead
    paths:
      - '.github/workflows/avatar-assets.yml'
  push:
    paths:
      - 'game/avatars-src/**'
