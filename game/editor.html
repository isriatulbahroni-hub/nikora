<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16241d" />
    <link rel="icon" href="data:," />
    <title>Studio Dunia | ORBIT</title>
    <style>
      :root { font-family: ui-sans-serif, 'Segoe UI', sans-serif; color: #fff; --bg: rgba(20,32,26,.82); --ok: #2e9e6b; --warn: #e0a526; --bad: #d9433a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #a9d4ee; user-select: none; -webkit-user-select: none; }
      #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      button, select, input { font: inherit; color: inherit; }
      .bar { position: fixed; z-index: 5; left: 0; right: 0; display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: var(--bg); backdrop-filter: blur(6px); }
      .top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); flex-wrap: wrap; row-gap: 6px; }
      .br { flex-basis: 100%; height: 0; }
      body.play .top { flex-wrap: nowrap; }
      .bottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); flex-direction: column; align-items: stretch; }
      .btn { min-width: 36px; height: 36px; padding: 0 10px; font-size: 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); cursor: pointer; white-space: nowrap; }
      .btn:disabled { opacity: .35; cursor: default; }
      .btn[aria-pressed="true"], .btn.on { background: var(--ok); border-color: var(--ok); }
      .btn.danger { border-color: var(--bad); }
      .name { flex: 1 1 120px; min-width: 0; height: 36px; font-size: 14px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); }
      .sel { height: 36px; font-size: 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); padding: 0 8px; }
      .palette { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
      .palette::-webkit-scrollbar { display: none; }
      .palette .btn { flex: 0 0 auto; }
      .status { display: flex; gap: 10px; align-items: center; font-size: 12px; flex-wrap: wrap; }
      .status .pill { padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.12); }
      .status .pill.bad { background: var(--bad); }
      .status .pill.warn { background: var(--warn); color: #1d1500; }
      .status .pill.ok { background: var(--ok); }
      .tools { position: fixed; z-index: 6; right: 10px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 8px; }
      .tools.show { display: flex; }
      .tools .btn { width: 46px; height: 46px; padding: 0; font-size: 18px; background: var(--bg); }
      .panel { position: fixed; z-index: 7; left: 10px; right: 10px; bottom: 120px; max-height: 40vh; overflow: auto; padding: 10px 12px; border-radius: 12px; background: rgba(12,20,16,.94); font-size: 13px; display: none; }
      .panel.show { display: block; }
      .panel h3 { margin: 0 0 6px; font-size: 14px; }
      .panel li { margin: 4px 0; cursor: pointer; }
      .panel .e { color: #ff8d86; } .panel .w { color: #f0c15a; }
      .toast { position: fixed; z-index: 9; left: 50%; top: 92px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.8); font-size: 13px; max-width: 90vw; display: none; }
      .toast.show { display: block; }
      .pad { position: fixed; z-index: 6; left: 14px; bottom: 150px; display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; }
      .pad.show { display: grid; }
      .pad .btn { width: 52px; height: 52px; padding: 0; font-size: 20px; background: var(--bg); }
      .hint { font-size: 12px; opacity: .85; }
      body.play .edit-only, body.review .edit-only { display: none !important; }
      .panel.big { top: 70px; bottom: 120px; max-height: none; }
      .panel .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
      .panel .row .grow { flex: 1 1 auto; min-width: 0; }
      .panel input[type=text], .panel input[type=email], .panel input[type=password] { width: 100%; height: 38px; margin: 4px 0; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
      .panel .proj { border-top: 1px solid rgba(255,255,255,.12); padding: 8px 0; }
      .panel .proj .st { font-size: 12px; opacity: .85; }
      .panel .mini { height: 30px; min-width: 0; padding: 0 9px; font-size: 12px; }
      .panel .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
      .panel small.msg { display: block; min-height: 1.2em; color: #f0c15a; }
      .reviewbar { position: fixed; z-index: 8; left: 0; right: 0; top: 0; padding: max(8px, env(safe-area-inset-top)) 10px 8px; background: #5a3d12; display: none; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
      body.review .reviewbar { display: flex; }
      body.review .top { top: 96px; }
      .reviewbar .grow { flex: 1 1 100%; }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div class="bar top">
      <button class="btn edit-only" id="undo" title="Urungkan (Ctrl+Z)" aria-label="Urungkan">↶</button>
      <button class="btn edit-only" id="redo" title="Ulangi (Ctrl+Y)" aria-label="Ulangi">↷</button>
      <input class="name edit-only" id="name" maxlength="60" aria-label="Nama dunia" />
      <button class="btn" id="play" aria-pressed="false">Uji jalan</button>
      <span class="br edit-only"></span>
      <select class="sel edit-only" id="template" aria-label="Template"></select>
      <select class="sel edit-only" id="sky" aria-label="Langit"><option value="siang">Siang</option><option value="senja">Senja</option><option value="malam">Malam</option></select>
      <button class="btn edit-only" id="save">Simpan</button>
      <button class="btn edit-only" id="open">Buka</button>
      <button class="btn" id="cloudBtn">Akun</button>
      <input type="file" id="file" accept="application/json,.json" hidden />
    </div>

    <div class="tools" id="tools">
      <button class="btn" id="rot" aria-label="Putar 90 derajat" title="Putar (R)">⟳</button>
      <button class="btn" id="dup" aria-label="Duplikat" title="Duplikat (D)">⧉</button>
      <button class="btn danger" id="del" aria-label="Hapus" title="Hapus (Del)">🗑</button>
    </div>

    <div class="panel" id="issues" role="region" aria-label="Masalah"></div>
    <div class="panel big" id="cloud" role="region" aria-label="Akun dan versi"></div>
    <div class="reviewbar" id="reviewbar" role="region" aria-label="Mode tinjau"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="pad" id="pad" aria-label="Kendali jalan">
      <span></span><button class="btn" data-k="up" aria-label="Maju">▲</button><span></span>
      <button class="btn" data-k="left" aria-label="Kiri">◀</button><span></span><button class="btn" data-k="right" aria-label="Kanan">▶</button>
      <span></span><button class="btn" data-k="down" aria-label="Mundur">▼</button><span></span>
    </div>

    <div class="bar bottom">
      <div class="palette edit-only" id="palette"></div>
      <div class="status">
        <span class="pill" id="usage"></span>
        <span class="pill" id="cloudState" style="display:none"></span>
        <button class="btn" id="issuesBtn" style="height:28px;padding:0 10px;font-size:12px"></button>
        <span class="hint" id="hint"></span>
      </div>
    </div>
    <script type="module" src="/src/editor-main.js"></script>
  </body>
</html>
