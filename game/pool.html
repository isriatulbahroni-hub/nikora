<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NIKORA · Uji air kolam renang</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd9ee; font-family: system-ui, sans-serif; }
    #pool-root { position: fixed; inset: 0; touch-action: none; }
    #pool-root canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; }
    .hud p { margin: 0; padding: 8px 12px; border-radius: 10px; background: rgba(10, 30, 45, 0.62); color: #fff; font-size: 13px; line-height: 1.35; max-width: 70%; }
    .hud button { pointer-events: auto; padding: 10px 14px; border: 0; border-radius: 10px; background: #0a5f86; color: #fff; font-size: 14px; }
    #pool-error { display: none; position: fixed; inset: 0; place-items: center; padding: 24px; background: #10202b; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <div id="pool-root"></div>
  <div class="hud">
    <p id="pool-info">Uji air kolam NIKORA. Seret: putar · roda/cubit: zoom. Pantulan hidup hanya untuk kolam terdekat dengan kamera.</p>
    <button id="under-button" type="button" aria-pressed="false">Selam</button>
  </div>
  <div id="pool-error"><div><p id="pool-error-text"></p><pre id="pool-error-detail"></pre></div></div>
  <script type="module" src="/src/pool-demo-main.js"></script>
</body>
</html>
