<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110d" />
    <title>Perjalanan menuju tempat acara | NIKORA</title>
    <style>
      :root { font-family: ui-sans-serif, 'Segoe UI', sans-serif; color: #fff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14110d; touch-action: none; user-select: none; -webkit-user-select: none; }
      #journey-root, #journey-root canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; z-index: 5; text-shadow: 0 0 3px rgba(0,0,0,.6), 0 1px 8px rgba(0,0,0,.6); }
      .top { top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; pointer-events: none; }
      .top small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
      .top strong { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
      .top span { font-size: 12px; opacity: .9; }
      .progress { margin-top: 8px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.28); overflow: hidden; }
      .progress i { display: block; height: 100%; width: 0; background: #e7c76a; }
      .bottom { left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 12px; }
      button, a.cta { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: rgba(20,17,13,.72); border: 1px solid rgba(231,199,106,.5); border-radius: 999px; padding: 10px 18px; cursor: pointer; text-decoration: none; }
      a.cta { background: #c9a24b; color: #1a1306; border-color: #c9a24b; padding: 12px 22px; font-size: 15px; }
      [hidden] { display: none !important; }
      #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #14110d; font-size: 14px; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="journey-root"></div>
    <div class="hud top">
      <small id="venue"></small>
      <strong id="seg">…</strong>
      <span id="part"></span> · <span id="eta"></span>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <div class="hud bottom">
      <button id="play" type="button">⏸ Jeda</button>
      <button id="skip" type="button">⏭ Lewati ke tujuan</button>
      <a id="enter" class="cta" href="#" hidden>Masuk</a>
    </div>
    <div id="loading">Menyiapkan perjalanan…</div>
    <script type="module" src="/src/journey-main.js"></script>
  </body>
</html>
