<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101a1d" />
    <title>ORBIT World | Aula Resepsi</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="wordmark" href="../index.html" aria-label="Kembali ke ORBIT">ORBIT</a>
        <div class="build-label"><span></span> Prototipe 1 · Aula virtual</div>
      </header>

      <section class="arena-frame" aria-label="Aula resepsi virtual ORBIT">
        <div id="game-root"></div>

        <div class="online-pill" aria-live="polite"><i id="online-dot"></i><span id="hall-guests">…</span></div>
        <span id="hall-status" hidden></span>

        <nav class="dock" id="dock" aria-label="Menu utama">
          <button id="chat-button" class="dock-btn" type="button" aria-label="Buka obrolan" title="Obrolan (Enter)">💬</button>
          <button id="mic-button" class="dock-btn" type="button" aria-label="Nyalakan mikrofon" aria-pressed="false" title="Suara dekat (V)" hidden>🎙</button>
          <button id="emoji-button" class="dock-btn" type="button" aria-label="Gerakan dan emoji" aria-expanded="false" aria-controls="emoji-sheet" title="Gerakan">😀</button>
          <button id="menu-button" class="dock-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-sheet" title="Menu">≡<i id="menu-dot" class="dock-dot" hidden></i></button>
        </nav>

        <div id="emoji-sheet" class="sheet sheet-pop" hidden role="menu" aria-label="Gerakan">
          <button id="emote-dance" class="sheet-tile" type="button" role="menuitem" aria-label="Joget"><span class="tile-ico">💃</span><span class="tile-label">Joget</span></button>
          <button id="emote-mirror" class="sheet-tile" type="button" role="menuitem" aria-pressed="false" aria-label="Cermin Gerak (miringkan HP)"><span class="tile-ico">📱</span><span class="tile-label">Cermin gerak</span></button>
          <button id="emote-clap" class="sheet-tile" type="button" role="menuitem" aria-label="Tepuk tangan"><span class="tile-ico">👏</span><span class="tile-label">Tepuk</span></button>
        </div>

        <div id="menu-sheet" class="sheet sheet-bottom" hidden role="dialog" aria-label="Menu">
          <div class="sheet-head"><strong>Menu</strong><button type="button" id="menu-close" class="sheet-close" aria-label="Tutup menu">✕</button></div>
          <div id="menu-grid" class="sheet-grid">
            <button id="mute-button" class="sheet-tile" type="button" aria-label="Matikan suara" aria-pressed="false" title="Suara (M)"><span class="tile-ico">♪</span><span class="tile-label">Suara</span></button>
            <button id="aura-toggle" class="sheet-tile" type="button" aria-pressed="true" aria-label="Aura avatar" title="Tampilkan atau sembunyikan aura"><span class="tile-ico">✨</span><span class="tile-label">Aura</span></button>
            <button id="party-button" class="sheet-tile" type="button" aria-label="Panggung Party Room" title="Panggung (P)" hidden><span class="tile-ico">🎤</span><span class="tile-label">Panggung</span></button>
            <button id="avatar-button" class="sheet-tile" type="button" aria-label="Ubah avatar" title="Ubah avatar" hidden><span class="tile-ico">👤</span><span class="tile-label">Avatar</span></button>
            <button id="home-button" class="sheet-tile" type="button" aria-label="Kembali ke pintu masuk" title="Ke pintu masuk (R)"><span class="tile-ico">⌂</span><span class="tile-label">Pintu masuk</span></button>
          </div>
        </div>

        <div id="join-overlay" class="result-overlay">
          <form id="join-form" class="result-panel editor-panel" autocomplete="off">
            <div class="editor-head">
              <p class="eyebrow">ORBIT WORLD</p>
              <h2 id="editor-title">Buat avatarmu</h2>
            </div>
            <div class="editor-layout">
              <div class="editor-stage">
                <canvas id="avatar-preview" class="avatar-preview" aria-label="Pratinjau avatar, geser untuk memutar, cubit untuk zoom"></canvas>
                <button type="button" class="stage-btn" data-view-reset aria-label="Kembalikan kamera" title="Kembalikan kamera">↺</button>
                <div class="stage-poses" role="group" aria-label="Pose pratinjau">
                  <button type="button" class="stage-chip" data-pose="wave" aria-pressed="false">👋 Lambai</button>
                  <button type="button" class="stage-chip" data-pose="dance" aria-pressed="false">💃 Joget</button>
                </div>
                <div class="stage-photo">
                  <button type="button" id="photo-style" class="stage-chip is-small" hidden>Gaya: Asli</button>
                  <button type="button" id="photo-clear" class="stage-chip is-small" hidden>Hapus foto</button>
                </div>
              </div>
              <div class="editor-controls">
                <input id="name-input" class="name-input" type="text" maxlength="24" placeholder="Nama tamu" aria-label="Nama tamu" />
                <div id="editor-tabs" class="editor-tabs" role="tablist"></div>
                <div id="editor-options" class="editor-options"></div>
              </div>
            </div>
            <div class="editor-actions">
              <input id="photo-input" type="file" accept="image/*" hidden />
              <div class="editor-tools">
                <button type="button" id="editor-random" class="tool-btn">Acak 🎲</button>
                <button type="button" id="photo-button" class="tool-btn">Foto wajah 📷</button>
                <button type="button" id="editor-export" class="tool-btn">Unduh 3D ⬇</button>
              </div>
              <button type="button" id="editor-dance" class="party-btn is-ghost" hidden>Joget 💃</button>
              <div class="editor-main-row">
                <button type="button" id="editor-cancel" class="party-btn is-ghost" hidden>Batal</button>
                <button id="join-button" class="action-button" type="submit"><span id="join-label">Masuk</span> <span>↗</span></button>
              </div>
            </div>
          </form>
        </div>

        <aside id="party-panel" class="party-panel" hidden aria-label="Panggung Party Room">
          <div class="party-head"><strong>Panggung</strong><button type="button" id="party-close" aria-label="Tutup panel">✕</button></div>
          <div id="party-body" class="party-body"></div>
        </aside>

        <div id="greet-menu" class="greet-menu" hidden aria-label="Sapa pemain terdekat">
          <span id="greet-name" class="greet-name"></span>
          <button type="button" data-greet="handshake" aria-label="Bersalaman" title="Salaman">🤝</button>
          <button type="button" data-greet="highfive" aria-label="Tos" title="Tos">✋</button>
          <button type="button" data-greet="wave" aria-label="Melambai" title="Lambai">👋</button>
          <button type="button" data-greet="bow" aria-label="Membungkuk hormat" title="Hormat">🙇</button>
        </div>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="greet-toast" class="greet-toast" hidden role="alertdialog" aria-label="Ajakan interaksi">
          <span id="greet-toast-text"></span>
          <button type="button" id="greet-yes" aria-label="Terima">✓</button>
          <button type="button" id="greet-no" aria-label="Tolak">✕</button>
        </div>

        <div id="chat-box" class="chat-box">
          <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
          <form id="chat-form" class="chat-form" hidden autocomplete="off">
            <input id="chat-input" class="chat-input" type="text" maxlength="160" placeholder="Ketik pesan…" aria-label="Pesan obrolan" enterkeyhint="send" />
            <button class="chat-send" type="submit" aria-label="Kirim">➤</button>
          </form>
        </div>

        <div class="arena-footer">
          <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> berjalan <span class="footer-divider">/</span> <kbd>Enter</kbd> obrolan <span class="footer-divider">/</span> <kbd>E</kbd> duduk · berdiri <span class="footer-divider">/</span> <kbd>Space</kbd> tepuk tangan <span class="footer-divider">/</span> <kbd>G</kbd> joget <span class="footer-divider">/</span> <kbd>Q</kbd><kbd>Z</kbd> putar kamera <span class="footer-divider">/</span> <kbd>R</kbd> pintu masuk <span class="footer-divider">/</span> <kbd>M</kbd> suara</p>
        </div>

        <div class="controls" aria-label="Kontrol sentuh">
          <div id="joy-zone" class="joy-zone">
            <div id="joy-base" class="joy-base" role="application" aria-label="Joystick gerak"><div id="joy-knob" class="joy-knob"></div></div>
          </div>
          <button id="touch-sit" class="atk-btn" type="button" aria-label="Duduk atau berdiri"><span id="sit-label">DUDUK</span></button>
        </div>
      </section>

      <footer class="page-footer">
        <span>BUILD 0.2 / AULA VIRTUAL</span>
        <span>Prototipe: belum ada suara, siaran langsung, atau akun</span>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
