name: Import car simulator (one-off)

# Salinan satu kali: menyalin kode simulator mobil (apex-formula + multiplayer) ke folder car-simulator/.
# Dijalankan otomatis saat file ini di-push ke branch car-simulator. File ini dihapus sebelum merge ke main.

on:
  workflow_dispatch:
  push:
    branches: [car-simulator]
    paths: [".github/workflows/import-car-simulator.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: car-simulator

      - name: Salin apex-formula (commit terkunci) ke car-simulator/
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/isriatulbahroni-hub/apex-formula /tmp/src
          git -C /tmp/src checkout --quiet 52c2d58de357dc244fec05550c2dd7726b0575df
          rm -rf car-simulator
          mkdir car-simulator
          git -C /tmp/src archive HEAD | tar -x -C car-simulator
          rm -rf car-simulator/.github
          printf '%s\n' \
            '# Catatan sumber' \
            '' \
            'Simulator mobil ini berbasis apex-formula (https://github.com/bridge-mind/apex-formula, lisensi MIT, lihat LICENSE).' \
            'Diimpor dari https://github.com/isriatulbahroni-hub/apex-formula, commit 52c2d58.' \
            '' \
            'Tambahan multiplayer: server/ (server otoritatif 120 Hz), src/net/ (klien multiplayer + prediksi), multiplayer.html, dan VehiclePhysics.setBodyState.' \
            '' \
            'Menjalankan server: cd server && npm install && cd .. && npx vite build --ssr server/index.ts --outDir server/dist && node server/dist/index.js' \
            'Menjalankan klien : npm install && npm run dev, lalu buka /multiplayer.html di dua tab.' \
            > car-simulator/NOTICE.md
          test -f car-simulator/LICENSE
          test -f car-simulator/src/net/mp-main.ts
          test -f car-simulator/server/index.ts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-simulator
          git commit -m "feat: import car simulator (apex-formula + multiplayer, commit 52c2d58)"
          git push origin HEAD:car-simulator
