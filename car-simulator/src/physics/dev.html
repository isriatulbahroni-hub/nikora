<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>APEX FORMULA — physics harness</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101418; color: #e8e8e8; font: 12px/1.35 ui-monospace, Menlo, monospace; }
      #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #telemetry { position: absolute; left: 10px; top: 10px; width: 330px; white-space: pre; background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 6px; pointer-events: none; }
      #log { position: absolute; right: 10px; top: 10px; width: 520px; max-height: calc(100% - 20px); overflow: auto; white-space: pre-wrap; background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 6px; }
      #help { position: absolute; left: 10px; bottom: 10px; white-space: pre; background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 6px; color: #9fb3c8; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="telemetry"></div>
    <div id="log"></div>
    <div id="help"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
