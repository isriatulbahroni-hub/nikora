<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>APEX FORMULA — Race Director harness</title>
    <style>
      body { margin: 0; background: #0b0d12; color: #e6e8ee; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #12151d; border-bottom: 1px solid #222; position: sticky; top: 0; }
      header button { background: #1d2230; color: #e6e8ee; border: 1px solid #333; padding: 4px 10px; cursor: pointer; font: inherit; }
      header button.active { background: #e10600; border-color: #e10600; }
      main { display: grid; grid-template-columns: 1fr 420px; gap: 12px; padding: 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 2px 6px; text-align: left; white-space: nowrap; border-bottom: 1px solid #1c2029; }
      th { color: #8b93a7; font-weight: 600; }
      .pos { color: #fff; font-weight: 700; }
      .s-purple { color: #c05cff; } .s-green { color: #3ad83a; } .s-yellow { color: #ffd600; } .s-none { color: #555; }
      .drs { color: #3ad83a; } .pit { color: #47c7fc; } .ret { color: #777; text-decoration: line-through; } .fin { color: #ffd600; }
      .pen { color: #ff6b6b; }
      #status { white-space: pre; background: #12151d; padding: 8px; margin: 0 0 8px; border: 1px solid #222; }
      #log, #checks { background: #12151d; border: 1px solid #222; padding: 8px; height: 46vh; overflow: auto; }
      #checks { height: auto; max-height: 40vh; margin-bottom: 8px; }
      .ok { color: #3ad83a; } .fail { color: #ff4d4d; }
      .k-flag { color: #ffd600; } .k-penalty, .k-warning { color: #ff6b6b; } .k-pit { color: #47c7fc; } .k-drs { color: #3ad83a; } .k-radio { color: #c8c8c8; font-style: italic; } .k-info { color: #e6e8ee; }
    </style>
  </head>
  <body>
    <header>
      <strong>RACE DIRECTOR HARNESS</strong>
      <button data-scenario="race">Race (5 laps)</button>
      <button data-scenario="quali">Qualifying</button>
      <button data-scenario="tt">Time trial + endSession</button>
      <span id="speed"></span>
    </header>
    <main>
      <section>
        <pre id="status"></pre>
        <table id="tower"></table>
      </section>
      <aside>
        <div id="checks"></div>
        <div id="log"></div>
      </aside>
    </main>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
