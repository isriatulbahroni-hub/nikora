<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX FORMULA — Audio Harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #151924;
        --line: #262c3b;
        --text: #e6e9f2;
        --dim: #8a93a8;
        --accent: #e10600;
        --green: #2ee06a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, system-ui, 'Segoe UI', sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-style: italic;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      #start {
        font: inherit;
        font-weight: 700;
        font-size: 18px;
        padding: 14px 32px;
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transform: skewX(-8deg);
      }
      #start[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr 320px;
        gap: 14px;
        padding: 14px 20px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
      }
      section h2 {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      .row {
        display: grid;
        grid-template-columns: 90px 1fr 56px;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .row label {
        color: var(--dim);
      }
      .row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      button.b {
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        background: #202637;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }
      button.b:hover {
        border-color: #3a4358;
      }
      button.b.on {
        background: #27303f;
        border-color: var(--green);
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 6px 0;
      }
      .checks label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--dim);
      }
      select {
        font: inherit;
        background: #202637;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      td,
      th {
        text-align: left;
        padding: 3px 4px;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--dim);
        font-weight: 500;
      }
      .meter {
        height: 6px;
        background: #0f131c;
        border-radius: 3px;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--green), #ffd600 70%, var(--accent));
      }
      #status {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
      }
      #status b {
        color: var(--text);
        font-weight: 600;
      }
      #status span {
        color: var(--dim);
      }
      canvas#map {
        width: 100%;
        height: 220px;
        background: #0f131c;
        border-radius: 6px;
        display: block;
      }
      #log {
        height: 140px;
        overflow: auto;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        color: var(--dim);
        white-space: pre-wrap;
      }
      .ok {
        color: var(--green);
      }
      .bad {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Apex Formula · Audio Harness</h1>
      <button id="start">START AUDIO</button>
      <div id="status"></div>
    </header>
    <main>
      <section>
        <h2>Player car</h2>
        <div id="sliders"></div>
        <div class="checks" id="checks"></div>
        <div class="row">
          <label>surface</label>
          <select id="surface">
            <option>asphalt</option>
            <option>kerb</option>
            <option>gravel</option>
            <option>grass</option>
            <option>runoff</option>
          </select>
          <span></span>
        </div>
        <div class="row">
          <label>camera</label>
          <select id="camera">
            <option>chase</option>
            <option>chase-far</option>
            <option>cockpit</option>
            <option>tcam</option>
            <option>nose</option>
            <option>tv</option>
            <option>helicopter</option>
          </select>
          <span></span>
        </div>
        <div class="row">
          <label>quality</label>
          <select id="quality">
            <option>low</option>
            <option>medium</option>
            <option selected>high</option>
            <option>ultra</option>
          </select>
          <span></span>
        </div>
        <div class="btns" id="autodrive"></div>
      </section>
      <section>
        <h2>Events</h2>
        <div class="btns" id="events"></div>
        <h2 style="margin-top: 12px">UI sounds</h2>
        <div class="btns" id="uisounds"></div>
        <h2 style="margin-top: 12px">Session / mix</h2>
        <div class="btns" id="session"></div>
        <div class="row">
          <label>master</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
          <output id="volume-out">0.80</output>
        </div>
        <h2 style="margin-top: 12px">Spatial test (6 orbiting AI cars, listener at centre)</h2>
        <canvas id="map" width="600" height="220"></canvas>
        <div class="row">
          <label>orbit speed</label>
          <input id="orbit" type="range" min="0" max="80" step="1" value="35" />
          <output id="orbit-out">35 m/s</output>
        </div>
      </section>
      <section>
        <h2>Meters</h2>
        <table id="meters"></table>
        <h2 style="margin-top: 12px">Log</h2>
        <div id="log"></div>
      </section>
    </main>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
