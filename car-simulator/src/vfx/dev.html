<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX FORMULA — VFX harness</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 system-ui, sans-serif; color: #ddd; }
      #c { position: fixed; inset: 0; display: block; }
      #panel { position: fixed; top: 8px; left: 8px; width: 250px; background: rgba(10, 12, 18, 0.82); border: 1px solid #333; border-radius: 6px; padding: 8px 10px; backdrop-filter: blur(6px); max-height: calc(100vh - 16px); overflow: auto; }
      #panel h3 { margin: 4px 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9cf; }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 3px 0; }
      #panel label span.v { min-width: 34px; text-align: right; color: #fc6; font-variant-numeric: tabular-nums; }
      #panel input[type=range] { flex: 1; }
      #panel select, #panel button { background: #1b2030; color: #eee; border: 1px solid #445; border-radius: 4px; padding: 2px 6px; font: inherit; }
      #panel button { cursor: pointer; margin: 2px 2px 2px 0; }
      #panel button:hover { background: #2a3350; }
      #stats { position: fixed; top: 8px; right: 8px; background: rgba(10, 12, 18, 0.82); border: 1px solid #333; border-radius: 6px; padding: 8px 10px; white-space: pre; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #cfe; }
      .row { display: flex; flex-wrap: wrap; gap: 2px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
