<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX FORMULA — UI harness</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #app { position: fixed; inset: 0; }
      #fake-scene { position: absolute; inset: 0; background:
        radial-gradient(60% 50% at 72% 58%, rgba(120,20,20,.35), transparent 60%),
        radial-gradient(40% 30% at 72% 70%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, #14141c 0%, #0a0a0f 60%, #050507 100%); }
      #fake-car { position: absolute; left: 62%; top: 50%; width: 30vw; height: 8vw; transform: translate(-50%, -50%) skewX(-8deg);
        background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.12) 50%, rgba(255,255,255,.04)); border-radius: 40% 60% 60% 40%;
        box-shadow: 0 4vw 6vw rgba(0,0,0,.6); filter: blur(1px); }
      #ui-root { position: absolute; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      #dev-bar { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 9999; display: flex; gap: 4px; padding: 4px 8px;
        background: rgba(0,0,0,.75); border-radius: 0 0 8px 8px; font: 11px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; color: #ddd; opacity: .35; transition: opacity .2s; }
      #dev-bar:hover { opacity: 1; }
      #dev-bar button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 7px; font: inherit; cursor: pointer; }
      #dev-bar button:hover { background: #e10600; border-color: #e10600; }
      #dev-bar .sep { width: 1px; background: #444; margin: 0 4px; }
      #dev-log { position: fixed; right: 4px; bottom: 4px; z-index: 9999; font: 10px/1.3 ui-monospace, Menlo, monospace; color: #9f9; background: rgba(0,0,0,.6); padding: 4px 6px; max-width: 30vw; max-height: 14vh; overflow: hidden; pointer-events: none; white-space: pre-wrap; opacity: .6; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fake-scene"><div id="fake-car"></div></div>
      <div id="ui-root"></div>
      <div id="dev-bar"></div>
      <div id="dev-log"></div>
    </div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
