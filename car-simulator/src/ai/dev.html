<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>APEX FORMULA — AI dev harness</title>
    <style>
      html, body { margin: 0; background: #101418; color: #dde; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      #wrap { display: flex; height: 100vh; }
      #view { flex: 1; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #side { width: 430px; padding: 8px 10px; overflow: auto; background: #0b0e11; border-left: 1px solid #222; }
      button, input, select { font: inherit; background: #1c2229; color: #dde; border: 1px solid #333; padding: 3px 8px; margin: 2px; border-radius: 3px; cursor: pointer; }
      button:hover { background: #2a323b; }
      table { border-collapse: collapse; width: 100%; margin-top: 6px; }
      td, th { padding: 1px 4px; text-align: right; white-space: nowrap; }
      th { color: #9ab; font-weight: normal; border-bottom: 1px solid #333; }
      td:nth-child(2), th:nth-child(2) { text-align: left; }
      #stats { white-space: pre; color: #bcd; margin-top: 6px; }
      .blue { color: #58f; } .pit { color: #fb4; } .fin { color: #6d6; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="view"><canvas id="c"></canvas></div>
      <div id="side">
        <div>
          <button id="start">Start race</button>
          <button id="pause">Pause</button>
          <button data-speed="1">×1</button>
          <button data-speed="4">×4</button>
          <button data-speed="8">×8</button>
          <button data-speed="16">×16</button>
        </div>
        <div>
          <button id="pit3">Pit car 3</button>
          <button id="pit0">Pit player (assist)</button>
          <button id="rain">Rain</button>
          <button id="zoom">Zoom</button>
          follow <input id="follow" type="number" value="0" min="0" max="19" style="width:44px" />
          diff <input id="diff" type="range" min="0" max="1" step="0.05" value="1" style="width:90px" /><span id="diffv">1.00</span>
        </div>
        <div id="stats"></div>
        <table id="tower"></table>
      </div>
    </div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
