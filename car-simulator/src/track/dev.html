<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX FORMULA — track dev</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #dfe6ee; }
      #gl { position: fixed; inset: 0; display: block; }
      #plot { position: fixed; right: 12px; top: 12px; width: 520px; height: 520px; background: rgba(8, 12, 18, 0.82); border: 1px solid #2a3442; border-radius: 6px; }
      #hud { position: fixed; left: 12px; top: 12px; background: rgba(8, 12, 18, 0.78); border: 1px solid #2a3442; border-radius: 6px; padding: 10px 12px; white-space: pre; max-width: 560px; }
      #stats { position: fixed; left: 12px; bottom: 12px; background: rgba(8, 12, 18, 0.78); border: 1px solid #2a3442; border-radius: 6px; padding: 10px 12px; white-space: pre; }
      #load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; background: rgba(8, 12, 18, 0.9); border: 1px solid #2a3442; border-radius: 8px; padding: 16px; display: none; }
      #bar { height: 6px; background: #1c2531; border-radius: 3px; overflow: hidden; margin-top: 8px; }
      #bar > div { height: 100%; width: 0; background: #e10600; }
      .ok { color: #58e07a; } .bad { color: #ff5c5c; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="plot" width="1040" height="1040"></canvas>
    <div id="hud"></div>
    <div id="stats"></div>
    <div id="load"><div id="label">Building…</div><div id="bar"><div></div></div></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
